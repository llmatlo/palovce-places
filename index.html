.timeline-bar {

  border-top: 2px solid #7f8c9a;

.timeline-play-btn {

  color: #6b6355; padding: 6px 10px; cursor: pointer;

  transition: color 0.2s;
}
.timeline-play-btn:hover { color: #2c3e50; }
.timeline-bar input[type="range"] {

.timeline-date {

}
.side-panel.hidden { transform: translateX(100%); }

.panel-toggle {
  position: absolute; top: 62px; right: 280px; z-index: 1000;
  background: #faf9f7; border: 1px solid #d8d4cc; border-right: none;
  color: #6b6355; padding: 8px 6px; cursor: pointer;
  border-radius: 4px 0 0 4px; font-size: 14px; transition: all 0.3s;

.panel-toggle:hover { color: #2c3e50; }
.panel-toggle.panel-hidden { right: 0; }

.panel-section { margin-bottom: 20px; }
.panel-section h3 {

  letter-spacing: 1px; margin-bottom: 10px;
  padding-bottom: 4px; border-bottom: 1px solid #d8d4cc;
}

/* Legend items */
.legend-item {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 0; font-size: 13px;
}
.legend-dot {
  width: 12px; height: 12px; border-radius: 50%;

}
.legend-shape { width: 14px; height: 14px; flex-shrink: 0; }
.shape-marker { background: none; border: none; }
.legend-cross {
  width: 14px; height: 14px; border-radius: 50%;
  flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15);
  position: relative;
  background: #555;
}
.legend-cross::before, .legend-cross::after {
  content: ''; position: absolute; background: #fff;
}
.legend-cross::before { left: 50%; top: 20%; bottom: 20%; width: 2px; transform: translateX(-50%); }
.legend-cross::after { top: 50%; left: 20%; right: 20%; height: 2px; transform: translateY(-50%); }

/* Layer toggles */
.layer-toggle {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; font-size: 13px; cursor: pointer;
}
.layer-toggle input { accent-color: #2c3e50; }

/* Hospital marker (divIcon) */
.hospital-marker {
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.25);
  position: relative;
}
.hospital-marker::before, .hospital-marker::after {
  content: ''; position: absolute; background: #fff;
}
.hospital-marker::before { left: 50%; top: 22%; bottom: 22%; width: 3px; transform: translateX(-50%); }
.hospital-marker::after { top: 50%; left: 22%; right: 22%; height: 3px; transform: translateY(-50%); }

.family-chip-icon {
  background: none; border: none; pointer-events: none;
}
.family-chip-inner {
  display: inline-block; white-space: nowrap;
  background: rgba(250, 249, 247, 0.95); border: 1px solid #d8d4cc;
  border-radius: 4px; padding: 3px 6px; font-size: 11px; line-height: 1.4;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);

.family-chip-line strong { color: #2c3e50; }
.family-chip-range { color: #8b7a66; }
body.hide-chips .family-chip-icon { display: none; }

.worksheet-star {
  display: flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
  font-size: 10px; line-height: 1; color: #fcd34d;
  text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 1px #000;
  pointer-events: none;
}

.leaflet-popup-tip { background: #faf9f7 !important; }

.popup-title {

.popup-families { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }

      "description": {
        "en": "Building 51, cadastral municipality Znojile. Georg Osredkar born here 23 Mar 1777 to Martinus Osredkar vulgo Liuk & Barbara Kuhar. The vulgo name \"Liuk\" comes from Liukovo. Owned by Georg's brother Joseph in 1827. ~30 min walk from Bela Peč 3, across the creek that separates the two clusters of family homesteads — connected by the road Gary calls \"the wiggly road between our two homesteads\" on his annotated 1826 cadastre map. Today's address is Sovinja Peč 2, in the hamlet of Trobelno. On Gary's overlay of the 1825 cadastral map on a modern one, none of today's buildings stands on an 1825 footprint: the Osredkar house (building 51) stood beside the old road, which has since been moved, so where exactly Georg was born is still to be found. The pin was moved in October 2026 to the farm itself, using the GPS in photos from a family visit in September 2026.",
        "sl": "Stavba 51, katastrska občina Znojile. Tu se je 23. 3. 1777 rodil Georg Osredkar, sin Martinusa Osredkarja vulgo Liuk in Barbare Kuhar. Vulgo ime »Liuk« izhaja iz imena Liukovo. Leta 1827 je bila domačija v lasti Georgovega brata Josepha. Približno 30 minut hoje od Bele Peči 3, čez potok, ki ločuje obe skupini družinskih domačij — povezuje ju cesta, ki jo Gary na svoji označeni katastrski karti iz leta 1826 imenuje »vijugasta cesta med našima domačijama«. Današnji naslov je Sovinja Peč 2, v zaselku Trobelno. Na Garyjevem prekrivanju katastrske karte iz leta 1825 z današnjo nobena od sedanjih stavb ne stoji na tlorisu iz leta 1825: hiša Osredkarjev (stavba 51) je stala ob stari cesti, ki je bila pozneje prestavljena, zato natančno mesto Georgovega rojstva še ni ugotovljeno. Oznaka je bila oktobra 2026 premaknjena na samo kmetijo, po podatkih GPS s fotografij z družinskega obiska septembra 2026."

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─── Languages ──────────────────────────────────────────────────────
// Display-text fields in the data may be a plain string or { en: "…", sl: "…" }.
// Translations are stored in the data, not fetched — switching only changes
// which one is shown. See SCHEMA.md "Languages".

let _lang = 'en';

const UI_STRINGS = {
  en: { tracks: 'Tracks', legend: 'Legend', showDetails: 'Show details →', hospital: 'Hospital stay' },
  sl: { tracks: 'Sloji', legend: 'Legenda', showDetails: 'Pokaži podrobnosti →', hospital: 'Bivanje v bolnišnici' }
};

const LANGUAGE_LABELS = { en: 'EN', sl: 'SL' };

function t(value) {
  if (value && typeof value === 'object') return value[_lang] || value.en || '';
  return value || '';
}

function uiText(key) {
  return (UI_STRINGS[_lang] || UI_STRINGS.en)[key] || UI_STRINGS.en[key];
}

function mapLanguages() {
  return (DATA.meta && DATA.meta.languages) || ['en'];
}

// URL ?lang= wins (so a shared link opens in that language), then the viewer's
// last choice, then the map's first listed language.
function initLanguage() {
  const langs = mapLanguages();
  const fromUrl = new URLSearchParams(window.location.search).get('lang');
  let saved = null;
  try { saved = localStorage.getItem('historyMapLang'); } catch (e) {}
  _lang = [fromUrl, saved].find(l => langs.includes(l)) || langs[0];
  document.documentElement.lang = _lang;
  buildLanguageToggle();
}

function buildLanguageToggle() {
  const el = document.getElementById('langToggle');
  const langs = mapLanguages();
  if (langs.length < 2) return;
  el.innerHTML = langs.map(l =>
    `<button type="button" class="lang-btn" data-lang="${l}" onclick="setLanguage('${l}')">${LANGUAGE_LABELS[l] || l.toUpperCase()}</button>`
  ).join('');
  el.style.display = 'flex';
  markActiveLanguage();
}

function markActiveLanguage() {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === _lang));
}

function setLanguage(lang) {
  if (lang === _lang) return;
  _lang = lang;
  try { localStorage.setItem('historyMapLang', lang); } catch (e) {}
  document.documentElement.lang = lang;
  markActiveLanguage();
  applyLanguage();
}

</script>
<script>
// ─── Marker construction ───────────────────────────────────────────
// Whether a track's stops get their color from `statuses` (a person/subject
// track with a with-unit/detached-style split) or always use the track's own
// fixed color (a peer/type track, e.g. "unit", or gary-research's settlement
// types). Configurable per track (`tracks.<key>.colorByStatus`); falls back
// to the pre-existing "unit" special case for maps built before this flag
// existed, so older data needs no changes.
function trackUsesOwnColor(trackKey, track) {
  if (track && typeof track.colorByStatus === 'boolean') return !track.colorByStatus;
  return trackKey === 'unit';
}

function trackColorsByStatus(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  return !trackUsesOwnColor(stop.track, track);
}

function resolveStopColor(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  if (!trackColorsByStatus(stop)) {
    return (track && track.color) || '#888';
  }
  const statusKey = stop.status || 'with-unit';
  const status = DATA.statuses && DATA.statuses[statusKey];
  if (status) return status.color;
  return (track && track.color) || '#888';
}

// Groups a stop's events by an optional per-event `family` tag and returns a
// small HTML label listing each family's earliest–latest date range (using
// each event's display-friendly `date` string, not dateSort, so approximate
// dates like "~1650s" render as written). Returns null if no event carries a
// `family` tag — callers should skip showing a chip entirely in that case.
function buildOccupancyChip(stop) {
  const families = {};
  (stop.events || []).forEach(ev => {
    if (!ev.family) return;
    if (!families[ev.family]) families[ev.family] = { earliest: ev, latest: ev };
    else {
      if (ev.dateSort < families[ev.family].earliest.dateSort) families[ev.family].earliest = ev;
      if (ev.dateSort > families[ev.family].latest.dateSort) families[ev.family].latest = ev;
    }
  });
  const names = Object.keys(families);
  if (!names.length) return null;

  const lines = names.map(name => {
    const { earliest, latest } = families[name];
    const range = earliest === latest ? t(earliest.date) : `${t(earliest.date)}–${t(latest.date)}`;
    return `<div class="family-chip-line"><strong>${name}</strong> <span class="family-chip-range">(${range})</span></div>`;
  });
  return `<div class="family-chip-inner">${lines.join('')}</div>`;
}

// Non-interactive divIcon marker carrying the chip HTML, positioned just off
// the stop's own marker. Kept as a separate map layer (not bindTooltip) so it
// doesn't conflict with the marker's own hover-name tooltip.
function buildChipIcon(chipHtml) {
  return L.divIcon({
    className: 'family-chip-icon',
    html: chipHtml,
    iconSize: null,
    iconAnchor: [-14, 10]
  });
}

function buildChipMarker(stop, chipHtml) {
  return L.marker([stop.lat, stop.lng], { icon: buildChipIcon(chipHtml), interactive: false });
}

function buildCircleMarker(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  const radius = (track && track.radius) || 7;
  const color = resolveStopColor(stop);
  const marker = L.circleMarker([stop.lat, stop.lng], {
    radius: radius,
    fillColor: stop.highlight ? '#b45309' : color,
    color: stop.highlight ? '#78350f' : '#fff',
    weight: stop.highlight ? 3 : 2,
    opacity: 1,
    fillOpacity: stop.highlight ? 0.9 : 0.85
  });
  marker.bindPopup(() => buildPopup(stop));
  marker.bindTooltip(() => t(stop.name), { permanent: false, direction: 'top', offset: [0, -radius] });
  return marker;
}

// Inline SVG for a non-circle track shape ("square", "diamond", "triangle"),
// sized `size` px square. Shared by the map markers and the legend swatches.
function shapeSvg(shape, size, fill, stroke, strokeWidth, fillOpacity) {
  const p = strokeWidth / 2;
  const s = size - p;
  const m = size / 2;
  let body;
  if (shape === 'square') {
    body = `<rect x="${p}" y="${p}" width="${s - p}" height="${s - p}"/>`;
  } else if (shape === 'diamond') {
    body = `<polygon points="${m},${p} ${s},${m} ${m},${s} ${p},${m}"/>`;
  } else {
    body = `<polygon points="${m},${p} ${s},${s} ${p},${s}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">` +
    `<g fill="${fill}" fill-opacity="${fillOpacity}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round">${body}</g></svg>`;
}

// Same styling rules as buildCircleMarker (incl. `highlight`), drawn as a divIcon.
function buildShapeMarker(stop, shape) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  const radius = (track && track.radius) || 7;
  const size = radius * 2 + 4;
  const svg = shapeSvg(
    shape, size,
    stop.highlight ? '#b45309' : resolveStopColor(stop),
    stop.highlight ? '#78350f' : '#fff',
    stop.highlight ? 3 : 2,
    stop.highlight ? 0.9 : 0.85
  );
  const icon = L.divIcon({ className: 'shape-marker', html: svg, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
  const marker = L.marker([stop.lat, stop.lng], { icon });
  marker.bindPopup(() => buildPopup(stop));
  marker.bindTooltip(() => t(stop.name), { permanent: false, direction: 'top', offset: [0, -size / 2] });
  return marker;
}

function buildHospitalMarker(stop) {
  const color = resolveStopColor(stop);
  const icon = L.divIcon({
    className: '',
    html: `<div class="hospital-marker" style="background:${color}; width:18px; height:18px;"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });
  const marker = L.marker([stop.lat, stop.lng], { icon });
  marker.bindPopup(() => buildPopup(stop));
  marker.bindTooltip(() => t(stop.name), { permanent: false, direction: 'top', offset: [0, -9] });
  return marker;
}

function buildMarkerForStop(stop) {
  if (stop.hospital) return buildHospitalMarker(stop);
  const track = DATA.tracks && DATA.tracks[stop.track];
  const shape = track && track.shape;
  return shape && shape !== 'circle' ? buildShapeMarker(stop, shape) : buildCircleMarker(stop);
}

// True when a stop has at least one outbound link into a project's worksheet/
// write-up directory — used to badge markers that have a documented "family
// sheet" behind them, as distinct from a bare place pin with no write-up.
// Matches "worksheets/" anywhere in the href, not just with a leading slash —
// a deployed site may rewrite "worksheets/x.html" to "worksheets/x.html"
// (no leading slash) if index.html moves to the repo root, so anchoring on
// "/worksheets/" would silently miss those.
function hasWorksheetLink(stop) {
  return !!(stop.links || []).some(link => (link.href || '').includes('worksheets/'));
}

// Small non-interactive star, centered exactly on the stop's own marker (not
// offset like the family/date chip) so it reads as a property of that one
// marker rather than a separate label. `interactive: false` lets clicks and
// hover pass through to the marker beneath it.
function buildWorksheetStar(stop) {
  const icon = L.divIcon({
    className: '',
    html: '<div class="worksheet-star">&#9733;</div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });
  return L.marker([stop.lat, stop.lng], { icon, interactive: false });
}

// Faint, non-interactive placeholder for a stop the timeline slider hasn't reached yet.
// Deliberately has no bindPopup/bindTooltip — only flips to a full marker once revealed.
function buildGhostMarker(stop) {
  return L.circleMarker([stop.lat, stop.lng], {
    radius: 5,
    fillColor: '#999',
    color: '#999',
    weight: 1,
    opacity: 0.3,
    fillOpacity: 0.3,
    interactive: false
  });
}

</script>
<script>
// ─── Popup construction ─────────────────────────────────────────────

// Coerce a families[] entry into object form. A plain string becomes
// {name: f} — no summary, so it always renders as a static tag.
function normalizeFamily(f) {
  return typeof f === 'string' ? { name: f } : f;
}

// Shared show/hide toggle for any popup detail block — used both by
// expandable per-family summaries and by gated stops' "Show details" button.
// Exposed as a plain global function since popup HTML is injected via
// Leaflet's bindPopup and its onclick attributes execute in global scope.
function togglePopupDetail(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const hidden = el.style.display === 'none' || !el.style.display;
  el.style.display = hidden ? 'block' : 'none';
}

function buildPopup(stop) {
  const gated = !!stop.gated;

  let html = `<div class="popup-title">${t(stop.name)}</div>`;
  if (gated && stop.fullPath) {
    html += `<div class="popup-address">${t(stop.fullPath)}</div>`;
  }

  const track = DATA.tracks && DATA.tracks[stop.track];
  const statusKey = trackColorsByStatus(stop) ? (stop.status || 'with-unit') : null;
  const status = statusKey && DATA.statuses && DATA.statuses[statusKey];
  const badgeColor = resolveStopColor(stop);
  const badgeLabel = status ? t(status.label) : (track ? t(track.label) : stop.track);

  let details = `<span class="popup-badge" style="background:${badgeColor}">${badgeLabel}</span>`;

  // Family tags — plain strings render as static tags (see SCHEMA.md "Family/date
  // chips"); objects with a `summary` render as expandable tags (see "Family tags").
  // A project with no families concept just omits stop.families.
  if (stop.families && stop.families.length) {
    details += '<div class="popup-families">';
    stop.families.forEach((raw, i) => {
      const f = normalizeFamily(raw);
      const color = (DATA.familyColors && DATA.familyColors[f.name]) || '#666';
      const label = f.years ? `${f.name} <span class="popup-family-tag-years">${t(f.years)}</span>` : f.name;
      if (f.summary) {
        const detailId = `popup-family-detail-${stop.id}-${i}`;
        details += `<button type="button" class="popup-family-tag popup-family-tag-expandable" style="background:${color}" onclick="togglePopupDetail('${detailId}')">${label}</button>`;
      } else {
        details += `<span class="popup-family-tag" style="background:${color}">${label}</span>`;
      }
    });
    details += '</div>';

    // Detail blocks for expandable families, one per family with a summary,
    // each independently toggled by its own tag above.
    stop.families.forEach((raw, i) => {
      const f = normalizeFamily(raw);
      if (!f.summary) return;
      const detailId = `popup-family-detail-${stop.id}-${i}`;
      details += `<div id="${detailId}" class="popup-family-detail" style="display:none;">`;
      details += `<div class="popup-family-detail-summary">${t(f.summary)}</div>`;
      (f.links || []).forEach(link => {
        details += `<a class="popup-link" href="${link.href}" target="_blank">${t(link.label)}</a>`;
      });
      details += '</div>';
    });
  }

  // Thumbnail strip, above the prose so it's visible without scrolling; each thumb
  // opens the in-page photo viewer (lightbox.js); Cmd/Ctrl-click still follows the
  // href to a new tab. Fixed thumb dimensions keep the popup
  // from resizing (and re-panning) as images load.
  if (stop.photos && stop.photos.length) {
    details += '<div class="popup-photos">';
    stop.photos.forEach((p, i) => {
      details += `<a class="popup-photo" href="${p.src}" target="_blank" title="${t(p.caption)}" onclick="return openLightbox(event, '${stop.id}', ${i})">` +
        `<img src="${p.thumb || p.src}" alt="${t(p.caption)}" width="72" height="72" loading="lazy"></a>`;
    });
    details += '</div>';
    const credits = [...new Set(stop.photos.map(p => t(p.credit)).filter(Boolean))];
    if (credits.length) details += `<div class="popup-photo-credit">${credits.join(' · ')}</div>`;
  }

  // Static prose, for stops without a dated events[] yet.
  if (stop.description) {
    details += `<div class="popup-desc">${t(stop.description)}</div>`;
  }

  const events = (stop.events || []).slice().sort((a, b) => {
    return (a.dateSort || '').localeCompare(b.dateSort || '');
  });

  if (events.length) {
    details += '<ul class="popup-events">';
    events.forEach(ev => {
      details += '<li class="popup-event">';
      details += `<div class="popup-event-date">${t(ev.date)}</div>`;
      if (ev.campaign) details += `<div class="popup-event-campaign">${t(ev.campaign)}</div>`;
      details += `<div class="popup-event-text">${t(ev.text)}</div>`;
      if (ev.source) details += `<div class="popup-event-source">${t(ev.source)}</div>`;
      details += '</li>';
    });
    details += '</ul>';
  }

  // Generic outbound links (e.g. gary-research's per-person worksheet writeups,
  // or a link back to a related static page like sp-houses.html).
  if (stop.links && stop.links.length) {
    stop.links.forEach(link => {
      details += `<a class="popup-link" href="${link.href}" target="_blank">${t(link.label)}</a>`;
    });
  }

  if (gated) {
    const detailsId = `popup-details-${stop.id}`;
    html += `<button type="button" class="popup-reveal-btn" onclick="togglePopupDetail('${detailsId}'); this.style.display='none';">${uiText('showDetails')}</button>`;
    html += `<div id="${detailsId}" class="popup-details" style="display:none;">${details}</div>`;
  } else {
    html += details;
  }

  return html;
}

</script>
<script>
// ─── Photo viewer ───────────────────────────────────────────────────
// Steps through one stop's photos over the map. Opened from the popup
// thumbnails (popup.js); the #photoLightbox markup lives in index.html.

let _lightboxPhotos = [];
let _lightboxIndex = 0;
let _lightboxTouchX = null;

function openLightbox(event, stopId, index) {
  if (event.metaKey || event.ctrlKey || event.shiftKey) return true;
  const stop = (DATA.stops || []).find(s => s.id === stopId);
  if (!stop || !stop.photos) return true;
  _lightboxPhotos = stop.photos;
  const multiple = _lightboxPhotos.length > 1;
  document.getElementById('lightboxPrev').style.display = multiple ? '' : 'none';
  document.getElementById('lightboxNext').style.display = multiple ? '' : 'none';
  document.getElementById('photoLightbox').style.display = 'flex';
  showLightboxPhoto(index);
  return false;
}

function showLightboxPhoto(i) {
  const n = _lightboxPhotos.length;
  _lightboxIndex = (i + n) % n;
  const p = _lightboxPhotos[_lightboxIndex];
  const img = document.getElementById('lightboxImg');
  img.src = p.src;
  img.alt = t(p.caption);
  document.getElementById('lightboxCaption').textContent = t(p.caption);
  document.getElementById('lightboxCredit').textContent = t(p.credit);
  document.getElementById('lightboxCounter').textContent = n > 1 ? `${_lightboxIndex + 1} / ${n}` : '';
  if (n > 1) new Image().src = _lightboxPhotos[(_lightboxIndex + 1) % n].src;
}

function stepLightbox(delta) {
  showLightboxPhoto(_lightboxIndex + delta);
}

function closeLightbox() {
  document.getElementById('photoLightbox').style.display = 'none';
  document.getElementById('lightboxImg').removeAttribute('src');
}

function lightboxIsOpen() {
  return document.getElementById('photoLightbox').style.display !== 'none';
}

// Capture phase, so Leaflet's own arrow-key panning doesn't also fire.
document.addEventListener('keydown', e => {
  if (!lightboxIsOpen()) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') stepLightbox(-1);
  else if (e.key === 'ArrowRight') stepLightbox(1);
  else return;
  e.preventDefault();
  e.stopPropagation();
}, true);

document.getElementById('photoLightbox').addEventListener('touchstart', e => {
  _lightboxTouchX = e.touches[0].clientX;
}, { passive: true });

document.getElementById('photoLightbox').addEventListener('touchend', e => {
  if (_lightboxTouchX === null || _lightboxPhotos.length < 2) return;
  const dx = e.changedTouches[0].clientX - _lightboxTouchX;
  _lightboxTouchX = null;
  if (Math.abs(dx) > 40) stepLightbox(dx < 0 ? 1 : -1);
});

</script>
<script>
// ─── Legend + track toggles ─────────────────────────────────────────
function buildLegend() {
  const legendEl = document.getElementById('legendItems');
  legendEl.innerHTML = '';

  if (DATA.statuses) {
    Object.values(DATA.statuses).forEach(s => {
      legendEl.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div>${t(s.label)}</div>`;
    });
  }

  // Tracks that always use their own fixed color (colorByStatus: false, or the
  // legacy "unit" track) get their own legend line — their color never shows
  // up via `statuses`. Covers both dad_army's "unit" track and a project like
  // gary-research's that has several peer tracks and no statuses at all.
  Object.entries(DATA.tracks || {}).forEach(([key, track]) => {
    if (trackUsesOwnColor(key, track)) {
      const swatch = track.shape && track.shape !== 'circle'
        ? `<div class="legend-shape">${shapeSvg(track.shape, 14, track.color, 'rgba(0,0,0,0.25)', 1, 1)}</div>`
        : `<div class="legend-dot" style="background:${track.color}"></div>`;
      legendEl.innerHTML += `<div class="legend-item">${swatch}${t(track.label)}</div>`;
    }
  });

  if ((DATA.stops || []).some(s => s.hospital)) {
    legendEl.innerHTML += `<div class="legend-item"><div class="legend-cross" style="background:#555"></div>${uiText('hospital')}</div>`;
  }
}

function buildTrackToggles() {
  const el = document.getElementById('trackToggles');
  el.innerHTML = '';
  if (!DATA.tracks) return;
  Object.keys(DATA.tracks).forEach(key => {
    const label = document.createElement('label');
    label.className = 'layer-toggle';
    label.innerHTML = `<input type="checkbox" ${trackVisible[key] === false ? '' : 'checked'} data-track="${key}"> ${t(DATA.tracks[key].label)}`;
    label.querySelector('input').addEventListener('change', (e) => {
      toggleTrack(key, e.target.checked);
    });
    el.appendChild(label);
  });
}

</script>
<script>
// ─── Data loading + map init ────────────────────────────────────────
let DATA = null;
let map = null;
let allStops = []; // { stop, track, firstDateSort, revealedMarker, ghostMarker, currentlyShownAs }
const trackVisible = {};
const state = { currentDateSort: null };
let playInterval = null;

async function loadData() {
  // Prefer inline data (works on file://). Fall back to fetch for live editing via http://.
  const inlineEl = document.getElementById('mapData');
  const inlineText = inlineEl ? inlineEl.textContent.trim() : '';
  if (inlineText && inlineText.startsWith('{')) {
    DATA = JSON.parse(inlineText);
  } else {
    const resp = await fetch('data.json');
    DATA = await resp.json();
  }
  buildMap();
}

// events[] isn't guaranteed sorted by the schema (popup.js sorts defensively too),
// so compute the earliest date rather than trusting events[0]. A stop can have
// no events[] at all (e.g. gary-research places with only a static description) —
// null means "not date-gated," handled in applyVisibility below.
function stopEarliestDateSort(stop) {
  if (!stop.events || !stop.events.length) return null;
  return stop.events.map(e => e.dateSort).sort()[0];
}

function applyHeadings() {
  document.getElementById('mapTitle').textContent = t(DATA.meta && DATA.meta.title) || 'History Map';
  document.getElementById('mapSubtitle').textContent = t(DATA.meta && DATA.meta.subtitle);
  document.getElementById('tracksHeading').textContent = uiText('tracks');
  document.getElementById('legendHeading').textContent = uiText('legend');
}

// Re-renders everything that shows data text. Popups and tooltips are bound
// as functions (markers.js), so they pick up the new language on next open.
function applyLanguage() {
  applyHeadings();
  buildLegend();
  buildTrackToggles();
  map.closePopup();
  allStops.forEach(entry => {
    if (entry.chipMarker) entry.chipMarker.setIcon(buildChipIcon(buildOccupancyChip(entry.stop)));
  });
  if (state.currentDateSort) {
    document.getElementById('timelineDate').textContent = formatDateSort(state.currentDateSort);
  }
}

function buildMap() {
  initLanguage();
  applyHeadings();

  const center = (DATA.meta && DATA.meta.defaultCenter) || [0, 0];
  const zoom = (DATA.meta && DATA.meta.defaultZoom) || 6;

  map = L.map('map', { center, zoom, zoomControl: false });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; 2026 Gary DelNero family research &middot; Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, TomTom, Garmin, FAO, NOAA, USGS, &copy; OpenStreetMap contributors, and the GIS User Community',
    maxZoom: 18
  }).addTo(map);

  map.panBy([-140, 0], { animate: false });

  (DATA.stops || []).forEach(stop => {
    const trackKey = stop.track || 'default';
    if (!(trackKey in trackVisible)) trackVisible[trackKey] = true;
    const chipHtml = stop.gated ? null : buildOccupancyChip(stop);
    allStops.push({
      stop,
      track: trackKey,
      firstDateSort: stopEarliestDateSort(stop),
      revealedMarker: buildMarkerForStop(stop),
      ghostMarker: buildGhostMarker(stop),
      chipMarker: chipHtml ? buildChipMarker(stop, chipHtml) : null,
      worksheetStar: hasWorksheetLink(stop) ? buildWorksheetStar(stop) : null,
      currentlyShownAs: null
    });
  });

  buildLegend();
  buildTrackToggles();
  setupTimeline();
  setupChipVisibility();
}

// Chips only show above a configurable zoom (avoids clutter at country/region
// scale); maps with no family-tagged events never produce chip markers at all,
// so this is a no-op for them regardless.
function setupChipVisibility() {
  const minZoom = DATA.meta && DATA.meta.chipMinZoom;
  if (typeof minZoom !== 'number') return;
  const update = () => {
    document.body.classList.toggle('hide-chips', map.getZoom() < minZoom);
  };
  map.on('zoomend', update);
  update();
}

// Combines track-toggle visibility with slider position into one of three states
// per stop: hidden (track off), ghost (not yet reached), revealed (fully shown).
// A stop with no dated events (firstDateSort === null) is never date-gated —
// it's revealed whenever its track is visible, same as before the slider existed.
function applyVisibility() {
  allStops.forEach(entry => {
    const wantState = !trackVisible[entry.track] ? null
      : entry.firstDateSort === null ? 'revealed'
      : entry.firstDateSort <= state.currentDateSort ? 'revealed'
      : 'ghost';
    if (entry.currentlyShownAs === wantState) return;
    if (entry.currentlyShownAs) {
      map.removeLayer(entry.currentlyShownAs === 'ghost' ? entry.ghostMarker : entry.revealedMarker);
      if (entry.currentlyShownAs === 'revealed' && entry.chipMarker) map.removeLayer(entry.chipMarker);
      if (entry.currentlyShownAs === 'revealed' && entry.worksheetStar) map.removeLayer(entry.worksheetStar);
    }
    if (wantState) {
      (wantState === 'ghost' ? entry.ghostMarker : entry.revealedMarker).addTo(map);
      if (wantState === 'revealed' && entry.chipMarker) entry.chipMarker.addTo(map);
      if (wantState === 'revealed' && entry.worksheetStar) entry.worksheetStar.addTo(map);
    }
    entry.currentlyShownAs = wantState;
  });
}

function toggleTrack(trackKey, visible) {
  trackVisible[trackKey] = visible;
  applyVisibility();
}

// Parse YYYY-MM-DD manually and build a local-time Date — new Date(dateSortString)
// parses as UTC midnight, which can display as the previous day west of Greenwich.
function formatDateSort(dateSort) {
  const [y, m, d] = dateSort.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(_lang, {
    year: 'numeric', month: 'long', day: 'numeric'
  });
}

function setupTimeline() {
  const uniqueDates = Array.from(new Set(
    allStops.flatMap(entry => (entry.stop.events || []).map(e => e.dateSort))
  )).sort();

  const slider = document.getElementById('timelineSlider');
  const dateLabel = document.getElementById('timelineDate');

  slider.min = 0;
  slider.max = uniqueDates.length - 1;
  slider.value = slider.max;
  state.currentDateSort = uniqueDates[slider.value];
  dateLabel.textContent = formatDateSort(state.currentDateSort);

  slider.addEventListener('input', () => {
    state.currentDateSort = uniqueDates[slider.value];
    dateLabel.textContent = formatDateSort(state.currentDateSort);
    applyVisibility();
  });

  document.getElementById('timelinePlayBtn').addEventListener('click', () => togglePlay(slider));

  applyVisibility();
}

function togglePlay(slider) {
  const btn = document.getElementById('timelinePlayBtn');
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
    btn.innerHTML = '&#9654;';
    return;
  }
  btn.innerHTML = '&#10074;&#10074;';
  playInterval = setInterval(() => {
    const next = Number(slider.value) + 1;
    if (next > Number(slider.max)) {
      clearInterval(playInterval);
      playInterval = null;
      btn.innerHTML = '&#9654;';
      return;
    }
    slider.value = next;
    slider.dispatchEvent(new Event('input'));
  }, 600);
}

function togglePanel() {
  const panel = document.getElementById('sidePanel');
  const btn = document.querySelector('.panel-toggle');
  panel.classList.toggle('hidden');
  btn.classList.toggle('panel-hidden');
  setTimeout(() => map.invalidateSize(), 350);
}

loadData();

</script>
